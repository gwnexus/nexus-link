name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Derive the version from the tag (v0.21.1 -> 0.21.1).
  # ---------------------------------------------------------------------------
  meta:
    name: Version from tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build, verify and publish binaries and images (shared with the dry run).
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: [meta]
    permissions:
      contents: read # checkout in the build jobs
      packages: write # push images and the multi-arch manifest to GHCR
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      publish: true

  # ---------------------------------------------------------------------------
  # GitHub Release with the binary tarballs, after images are published.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [build]
    permissions:
      contents: write # create the GitHub Release and upload the tarballs

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nexus-link-*-linux
          merge-multiple: true

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            nexus-link-aarch64-linux.tar.gz \
            nexus-link-x86_64-linux.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes

name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the exact version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run unit tests
        run: cargo test --all

  # PG LISTEN/NOTIFY wake-up against a real PostgreSQL (hub ADR-0071).
  # The listener once hung silently on every node; these tests catch that.
  pg-listener:
    name: PG LISTEN wake-up
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run live listener tests
        env:
          # Throwaway CI database, not a secret.
          NEXUS_LINK_TEST_PG_URL: postgres://postgres:test@127.0.0.1:5432/postgres
        run: cargo test -p nexus-link-service -- --ignored pg_listener::tests::live

  # Integration tests that simulate the full CLI flow
  # These run only on Linux (the target deployment platform)
  integration:
    name: Integration (${{ matrix.scenario }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [unit-tests]
    strategy:
      matrix:
        scenario:
          - cli-help
          - cli-preflight
          - cli-register-validation
          - cli-unregister
          - service-health

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the exact version pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build all binaries
        run: cargo build --all

      # -- Scenario: CLI help and version output --
      - name: "Test: CLI help and version"
        if: matrix.scenario == 'cli-help'
        run: |
          ./target/debug/nexus-link --version
          ./target/debug/nexus-link --help
          ./target/debug/nexus-link register --help
          ./target/debug/nexus-link preflight --help
          ./target/debug/nexus-link upgrade --help
          ./target/debug/nexus-link agent --help
          echo "All CLI help commands succeeded"

      # -- Scenario: Preflight check (no GPU in CI = expected failure) --
      - name: "Test: Preflight check (expects incompatible in CI)"
        if: matrix.scenario == 'cli-preflight'
        run: |
          set +e
          ./target/debug/nexus-link preflight
          EXIT_CODE=$?
          set -e
          # In CI (no GPU), preflight should exit 1 (incompatible)
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "PASS: Preflight correctly reports incompatible (no GPU in CI)"
          elif [ "$EXIT_CODE" -eq 0 ]; then
            echo "PASS: Preflight passed (CI runner has GPU?)"
          else
            echo "FAIL: Unexpected exit code: $EXIT_CODE"
            exit 1
          fi

      # -- Scenario: Register validation (bad token format) --
      - name: "Test: Register token validation"
        if: matrix.scenario == 'cli-register-validation'
        run: |
          # Test 1: Invalid token format should fail immediately
          set +e
          OUTPUT=$(./target/debug/nexus-link register --token "invalid_token" --skip-preflight 2>&1)
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "Invalid token format"; then
            echo "PASS: Invalid token correctly rejected"
          else
            echo "FAIL: Expected token validation error"
            echo "Output: $OUTPUT"
            exit 1
          fi

          # Test 2: Valid format but unreachable API should fail with network error
          set +e
          OUTPUT=$(./target/debug/nexus-link register \
            --token "nxs_node_test123abc" \
            --api-url "https://nonexistent.invalid" \
            --skip-preflight 2>&1)
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "PASS: Unreachable API correctly fails registration"
          else
            echo "FAIL: Registration should not succeed against invalid API"
            exit 1
          fi

      # -- Scenario: Unregister command --
      - name: "Test: Unregister command"
        if: matrix.scenario == 'cli-unregister'
        run: |
          # Test 1: Unregister with no config (no --force) should fail with exit 1
          set +e
          OUTPUT=$(./target/debug/nexus-link unregister 2>&1)
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ] && echo "$OUTPUT" | grep -q "not registered"; then
            echo "PASS: Unregister correctly fails when no config exists"
          else
            echo "FAIL: Expected 'not registered' error"
            echo "Output: $OUTPUT"
            exit 1
          fi

          # Test 2: Unregister with --force and no config should succeed (exit 0)
          set +e
          OUTPUT=$(./target/debug/nexus-link unregister --force 2>&1)
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "PASS: Unregister --force succeeds with no config"
          else
            echo "FAIL: --force should not fail (exit $EXIT_CODE)"
            echo "Output: $OUTPUT"
            exit 1
          fi

          # Test 3: Create a config, then unregister --force should remove it
          mkdir -p ~/.nexus-link
          cat > ~/.nexus-link/config.toml << 'EOF'
          [node]
          node_id = "test-node-unregister"
          name = "ci-test-node"
          token = "nxs_node_ci_test_token"
          tags = []

          [api]
          base_url = "https://nonexistent.invalid"
          push_interval_secs = 30

          [service]
          listen_addr = "127.0.0.1"
          port = 8443
          EOF

          ./target/debug/nexus-link unregister --force
          if [ ! -f ~/.nexus-link/config.toml ]; then
            echo "PASS: Config file removed after unregister"
          else
            echo "FAIL: Config file still exists"
            exit 1
          fi

      # -- Scenario: Service health endpoint --
      - name: "Test: Service health endpoint"
        if: matrix.scenario == 'service-health'
        run: |
          # Create a minimal config for the service
          mkdir -p ~/.nexus-link
          cat > ~/.nexus-link/config.toml << 'EOF'
          [node]
          node_id = "test-node-ci"
          name = "ci-runner"
          token = "nxs_node_ci_test_token"
          tags = ["ci"]

          [api]
          base_url = "https://nexus.gatewarden.eu"
          push_interval_secs = 30

          [service]
          listen_addr = "127.0.0.1"
          port = 8443
          EOF

          # Start the service in background
          ./target/debug/nexus-link-service &
          SERVICE_PID=$!
          sleep 2

          # Test health endpoint
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8443/api/health || echo "000")

          # Stop service
          kill $SERVICE_PID 2>/dev/null || true
          wait $SERVICE_PID 2>/dev/null || true

          if [ "$HTTP_CODE" = "200" ]; then
            echo "PASS: Health endpoint returned 200"
          else
            echo "FAIL: Health endpoint returned $HTTP_CODE (expected 200)"
            exit 1
          fi

  # Summary job for branch protection
  integration-result:
    name: Integration Result
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [unit-tests, integration]
    if: always()
    steps:
      - name: Check results
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$UNIT_RESULT" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          if [ "$INTEGRATION_RESULT" != "success" ]; then
            echo "Integration tests failed"
            exit 1
          fi
          echo "All tests passed"

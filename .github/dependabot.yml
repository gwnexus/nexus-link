# Dependency updates. Actions are pinned to commit SHAs; Dependabot bumps
# the SHA and the version comment together. Docker base images follow once
# they are pinned (see docker/).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  # Bumps the pinned channel in rust-toolchain.toml. Keep the Docker builder
  # image in docker/ on the same Rust version.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
